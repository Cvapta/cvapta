<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я тут один</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vh;
            overflow: hidden;
            cursor: pointer;
        }
        .icon {
            max-width: 25vw;
            max-height: 25vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        .timer {
            font-size: clamp(2rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }
        #music { display: none; }
    </style>
</head>
<body>
    <img src="icon.png" alt="" class="icon">
    <div class="timer" id="timer">00:00:00:00</div>

    <!-- Музыка: ForgiveBurial.mp3 -->
    <audio id="music" src="ForgiveBurial.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            // ===== Мигающий favicon (чёрный ↔ белый) =====
            const favSize = 32;

            function makeFavicon(color) {
                const canvas = document.createElement('canvas');
                canvas.width = favSize;
                canvas.height = favSize;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, favSize, favSize);
                return canvas.toDataURL('image/png');
            }

            const favBlack = makeFavicon('#000000');
            const favWhite = makeFavicon('#ffffff');

            let favLink = document.querySelector("link[rel*='icon']");
            if (!favLink) {
                favLink = document.createElement('link');
                favLink.rel = 'icon';
                document.head.appendChild(favLink);
            }

            let favState = false;
            favLink.href = favBlack;

            setInterval(() => {
                favState = !favState;
                favLink.href = favState ? favWhite : favBlack;
            }, 500);

            // ===== Анимированный title =====
            const titleNode = document.querySelector('title');

            const frames = [
                { text: "Я",              delay: 500 },
                { text: "Я тут",          delay: 500 },
                { text: "Я тут один",     delay: 1600 },

                { text: "7",                  delay: 450 },
                { text: "7 ноября",           delay: 450 },
                { text: "7 ноября я",         delay: 450 },
                { text: "7 ноября я буду",    delay: 450 },
                { text: "7 ноября я буду...", delay: 1600 },

                { text: "стёрт", delay: 900 },

                { text: "((((",                                         delay: 400 },
                { text: "(((((((((",                                    delay: 400 },
                { text: "(((((((((((((((((",                            delay: 400 },
                { text: "((((((((((((((((((((((((",                     delay: 400 },
                { text: "((((((((((((((((((((((((((((((",               delay: 1600 },

                { text: "стёрт", delay: 900 }
            ];

            let i = 0;
            let pulseTimer = null;

            function clearPulse() {
                if (pulseTimer) {
                    clearInterval(pulseTimer);
                    pulseTimer = null;
                }
            }

            function playFrame() {
                clearPulse();
                const frame = frames[i];

                titleNode.textContent = frame.text;

                let flip = false;
                pulseTimer = setInterval(() => {
                    titleNode.textContent = flip ? frame.text : frame.text + "\u200B";
                    flip = !flip;
                }, 250);

                setTimeout(() => {
                    clearPulse();
                    i = (i + 1) % frames.length;
                    playFrame();
                }, frame.delay);
            }

            setTimeout(playFrame, 500);

            // ===== Таймер до 7 ноября 2026 =====
            const targetDate = new Date(2026, 10, 7, 0, 0, 0);

            function updateTimer() {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    document.getElementById('timer').textContent = '00:00:00:00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const pad = (num) => String(num).padStart(2, '0');

                document.getElementById('timer').textContent =
                    `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            updateTimer();
            setInterval(updateTimer, 1000);

            // ===== Музыка по клику =====
            const music = document.getElementById('music');
            let started = false;

            function startMusic() {
                if (started) return;
                started = true;

                music.volume = 0.6;
                music.play().catch(err => {
                    console.warn('Не удалось запустить музыку:', err);
                });
            }

            document.body.addEventListener('click', startMusic, { once: true });
        })();
    </script>
</body>
</html>
