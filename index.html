<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер до 7 ноября 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4vh;
            overflow: hidden;
            cursor: pointer;
        }
        .icon {
            max-width: 25vw;
            max-height: 25vh;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        .timer {
            font-size: clamp(2rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-align: center;
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
        }
        #music {
            display: none;
        }
    </style>
</head>
<body>
    <img src="icon.png" alt="" class="icon">
    <div class="timer" id="timer">00:00:00:00</div>

    <!-- Замените src на путь к вашему m4a-файлу -->
    <audio id="music" src="Forgive Burial.m4a" loop preload="auto"></audio>

    <script>
        (function() {
            // ===== Таймер до 7 ноября 2026 =====
            const target = new Date(2026, 10, 7, 0, 0, 0);

            function updateTimer() {
                const now = new Date();
                const diff = target - now;

                if (diff <= 0) {
                    document.getElementById('timer').textContent = '00:00:00:00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const pad = (num) => String(num).padStart(2, '0');

                document.getElementById('timer').textContent =
                    `${pad(days)}:${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            updateTimer();
            setInterval(updateTimer, 1000);

            // ===== Музыка по клику =====
            const music = document.getElementById('music');
            let started = false;

            function startMusic() {
                if (started) return;
                started = true;

                music.volume = 0.6;
                music.play().catch(err => {
                    console.warn('Не удалось запустить музыку:', err);
                });
            }

            document.body.addEventListener('click', startMusic, { once: true });
        })();
    </script>
</body>
</html>
